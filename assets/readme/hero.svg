<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">DeepSeek-V4.1-Flash vs. the 2017 Transformer</title>
  <desc id="heroDesc">An interactive 3D architecture viewer. Right: the DeepSeek-V4.1-Flash 40-layer CED stack, 20 causal encoder layers above 20 decoder layers, separated by a dashed boundary; the decoder global KV is projected from H20. Left: a log-scale comparison of KV cache cost per token, 890 bytes in FP4 for DeepSeek-V4.1-Flash against the 2017 Transformer naive baseline of about 36 kilobytes.</desc>

  <rect width="1200" height="420" rx="22" fill="#0a0f1c"/>

  <g id="title-block">
    <text x="64" y="58" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2.4" fill="#8d98ad">INTERACTIVE 3D ARCHITECTURE VIEWER</text>
    <text x="64" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700" fill="#e8ecf4">DeepSeek-V4.1-Flash</text>
    <text x="64" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="29" fill="#8d98ad">vs. the 2017 Transformer</text>
    <text x="64" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8d98ad">Built from the papers themselves — every</text>
    <text x="64" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8d98ad">number is traceable to the technical report.</text>
    <text x="64" y="270" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#e8ecf4">552B backbone · 8B prefill / 16B decode</text>
  </g>

  <g id="kv-cost">
    <text x="64" y="302" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="1" fill="#8d98ad">KV CACHE PER TOKEN — LOG SCALE</text>
    <rect x="64" y="312" width="62" height="14" rx="4" fill="#18b8a8"/>
    <text x="146" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#e8ecf4">DeepSeek-V4.1-Flash<tspan fill="#18b8a8"> · 890 B/token</tspan><tspan fill="#8d98ad"> · FP4</tspan></text>
    <rect x="64" y="340" width="260" height="14" rx="4" fill="#9a6bff"/>
    <text x="344" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8d98ad">2017 baseline · <tspan fill="#9a6bff">≈36 KB</tspan></text>
    <text x="64" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8d98ad">global KV 890 B/token: 1/4 of V4-Flash, 1/437 of V1</text>
    <text x="64" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8d98ad">36 KB baseline: naive, base model — viewer arithmetic</text>
  </g>

